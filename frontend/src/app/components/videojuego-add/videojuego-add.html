<h2>Nuevo videojuego</h2>
<!-- No va mas el titulo tiene validacion visual
@if (mensaje) {  condición para mostrar el mensaje de error en caso de que al presionar el botón Guardar haya algún error en el formulario 
  <div class="alert alert-danger">{{ mensaje }}</div>
} -->
<form #f="ngForm" (ngSubmit)="guardar()"> <!-- #f="ngForm" para crear una referencia y asignarla a la variable f para inspeccionar el estado del formulario -->
  <div class="mb-3">
    <label class="form-label" for="titulo">Título *</label>
    <input id="titulo" name="titulo" class="form-control" required maxlength="200"  
           #titulo="ngModel"
           [(ngModel)]="videojuego.titulo" 
           [ngClass]="{'is-invalid': titulo.invalid && titulo.touched}"> <!-- #titulo="ngModel" para crear una variable titulo que controla el estado del input que reconoce Angular. is-invalid: clase de bootstrap que pinta el borde del input de rojo. -->
     <div class="invalid-feedback">El titulo es obligatorio. </div>
      <!-- [(ngModel)] para enviar el valor del input (lo que está entre paréntesis) al componente y para mostrar el valor en el input (lo que está entre corchetes) desde el componente -->     
      <!-- [ngClass] para agregar la clase is-invalid al input si el formulario fue enviado y el control del input es inválido -->
  </div>
  <div class="mb-3">
    <label class="form-label" for="sinopsis">Sinopsis</label>
    <textarea id="sinopsis" name="sinopsis" class="form-control" rows="4"
              [(ngModel)]="videojuego.sinopsis"></textarea>
  </div>
  <div class="mb-3">
    <label class="form-label" for="portada">URL de la portada</label>
    <input id="portada" name="portada_url" type="url" class="form-control"
           [(ngModel)]="videojuego.portada_url">
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label" for="fecha">Lanzamiento</label>
      <input id="fecha" name="fecha_lanzamiento" type="date" class="form-control"
             [(ngModel)]="videojuego.fecha_lanzamiento">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label" for="desarrollador">Desarrollador</label>
      <input id="desarrollador" name="desarrollador" class="form-control" maxlength="100"
             [(ngModel)]="videojuego.desarrollador">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label" for="distribuidor">Distribuidor</label>
      <input id="distribuidor" name="distribuidor" class="form-control" maxlength="100"
             [(ngModel)]="videojuego.distribuidor">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label d-block">Géneros</label>
    <!-- bootstrap -> d-flex flex-wrap gap-2: los chips quedan en fila, bajan de línea si no entran y con espacio entre ellos -->
    <div class="d-flex flex-wrap gap-2">
      @for (g of generos; track g.id) {
        <!-- [checked]: aparece tildada si el juego ya lo tiene
             (change): al hacer clic lo agrega o lo saca de videojuego.generos -->
        <!-- btn-check oculta la casilla; el label de al lado se ve como botón y queda "pintado" cuando está tildada -->
         <!-- [id] enlaza la propiedad id del input con el atributo for del label para que al hacer clic en el label se tilde/destile la casilla (cambie en tiempo de ejecución) -->
        <input class="btn-check" type="checkbox" [id]="'genero-' + g.id"
               [checked]="tieneGenero(g)" (change)="alternarGenero(g)">
        <!-- [for] une el texto con su checkbox: clic en el nombre también la tilda -->
        <label class="btn btn-sm btn-outline-primary rounded-pill" [for]="'genero-' + g.id">{{ g.nombre }}</label>
      }
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label d-block">Plataformas</label>
    <div class="d-flex flex-wrap gap-2">
      @for (p of plataformas; track p.id) {
        <input class="btn-check" type="checkbox" [id]="'plataforma-' + p.id"
               [checked]="tienePlataforma(p)" (change)="alternarPlataforma(p)">
        <label class="btn btn-sm btn-outline-secondary rounded-pill" [for]="'plataforma-' + p.id">{{ p.nombre }}</label>
      }
    </div>
  </div>
   <!-- Guardar queda deshabilitado mientras el form sea inválido (título vacío) -->
  <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Guardar</button>
  <a class="btn btn-secondary ms-2" routerLink="/videojuegos">Cancelar</a>
</form>
